<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luyện cộng trừ và tìm x - Bé học toán</title>
  <style>

    :root {
      --pink: #ff6b9d;
      --orange: #ff9a56;
      --yellow: #ffd93d;
      --green: #6bcb77;
      --blue: #4d96ff;
      --purple: #9b59b6;
      --bg-start: #e8f5e9;
      --bg-end: #e3f2fd;
      --card-bg: #ffffff;
      --shadow: 0 8px 30px rgba(0,0,0,0.1);
      --correct: #27ae60;
      --wrong: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: #2d3436;
    }

    .app {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      min-height: 100vh;
    }
    .app.practicing { grid-template-columns: minmax(0, 1fr); }
    .app.practicing .sidebar { display: none; }

    .sidebar {
      background: linear-gradient(180deg, #f0fdf4, #fff);
      border-right: 3px solid #c8e6c9;
      padding: 24px 20px;
      box-shadow: 4px 0 20px rgba(0,0,0,0.05);
    }

    .nav-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .nav-link:hover { color: #2e6bd4; }

    .brand {
      margin: 0 0 4px;
      font-size: 26px;
      color: var(--purple);
      text-shadow: 2px 2px 0 #e8d5f0;
    }
    .brand small { display: block; font-size: 13px; color: #999; font-weight: 600; margin-top: 2px; }

    .field { margin-bottom: 16px; }
    .field .hint { margin-top: 6px; }
    .field label, .field legend {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 800;
      color: #666;
    }

    fieldset { border: 0; padding: 0; margin: 0; }

    select, input[type="number"] {
      width: 100%;
      height: 46px;
      border: 3px solid #e8e0e2;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 700;
      background: #fcfafb;
      color: #2d3436;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="number"]:focus { border-color: var(--purple); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { margin: 0; appearance: none; }
    input[type="number"] { appearance: textfield; }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .choice {
      position: relative;
      display: block;
      height: 44px;
      border: 3px solid #e8e0e2;
      border-radius: 12px;
      background: #fcfafb;
      cursor: pointer;
      line-height: 38px;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      user-select: none;
      transition: all 0.15s;
    }
    .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .choice:focus-within { outline: 3px solid var(--purple); outline-offset: 2px; }
    .choice:has(input:checked) {
      border-color: var(--purple);
      background: #f3e5f5;
      color: var(--purple);
    }
    [hidden] { display: none !important; }

    .actions { display: grid; gap: 8px; margin-top: 20px; }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    button:active { transform: scale(0.96); }

    .btn-purple {
      background: linear-gradient(135deg, var(--purple), #7d3c98);
      color: #fff;
      box-shadow: 0 4px 15px rgba(155,89,182,0.4);
    }
    .btn-purple:hover { box-shadow: 0 6px 20px rgba(155,89,182,0.5); }

    .btn-green {
      background: linear-gradient(135deg, var(--green), #27ae60);
      color: #fff;
      box-shadow: 0 4px 15px rgba(107,203,119,0.4);
    }
    .btn-green:hover { box-shadow: 0 6px 20px rgba(107,203,119,0.5); }

    .btn-orange {
      background: linear-gradient(135deg, var(--orange), #e67e22);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255,154,86,0.4);
    }
    .btn-orange:hover { box-shadow: 0 6px 20px rgba(255,154,86,0.5); }

    .score {
      min-height: 48px;
      margin: 12px 0 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fcfafb;
      border: 2px dashed #e8e0e2;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.4;
      color: #888;
    }

    main { min-width: 0; padding: 28px; }
    .topbar { margin-bottom: 20px; }
    .session-actions { margin-bottom: 12px; }
    .app:not(.practicing) .session-actions { display: none; }
    .app.practicing .session-actions { display: flex; }
    .session-actions .ui-button { flex: 1 1 130px; }

    h2 {
      margin: 0 0 4px;
      font-size: 28px;
      color: var(--purple);
      text-shadow: 2px 2px 0 #e8d5f0;
    }

    .hint { margin: 0; color: #999; font-weight: 600; font-size: 15px; }

    .problems { display: grid; gap: 12px; }
    .problems.horizontal { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
    .problems.vertical { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: start; }

    .problem {
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      border: 3px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }

    .problem.correct {
      border-color: var(--correct);
      background: #eafaf1;
    }
    .problem.wrong {
      border-color: var(--wrong);
      background: #fdedec;
    }

    /* Horizontal layout */
    .problems.horizontal .problem {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 100px 32px;
      align-items: center;
      gap: 12px;
      min-height: 82px;
    }
    .problems.horizontal .problem.mcq { grid-template-columns: minmax(0, 1fr) 32px; }
    .problems.horizontal .problem.find-x { grid-template-columns: minmax(0, 1fr) 32px; }
    .problem.mcq .expression { grid-column: 1 / -1; }
    .problem.find-x .expression { grid-column: 1 / -1; flex-wrap: wrap; }
    .hint-formula { padding: 3px 9px; border-radius: 10px; background: #fff1f2; color: #be123c; font-weight: 800; }
    .find-hint { grid-column: 1 / -1; grid-row: 2; }
    .x-answer { display: flex; align-items: center; gap: 8px; grid-column: 1; grid-row: 3; font-size: 22px; font-weight: 800; }
    .problem.find-x .result { grid-column: 2; grid-row: 3; }
    .mcq-options { display: flex; gap: 6px; }
    .mcq-btn { width: 54px; min-height: 50px; padding: 0; border: 3px solid #e8e0e2; border-radius: 14px; background: #fcfafb; color: #2d3436; font-size: 22px; }
    .mcq-btn.selected { border-color: var(--purple); background: #f3e5f5; }
    .mcq-btn.correct { border-color: var(--correct); background: #d5f5e3; }
    .mcq-btn.wrong { border-color: var(--wrong); background: #fadbd8; }

    .problems.horizontal .expression {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 28px;
      color: #2d3436;
      min-width: 0;
      overflow: hidden;
    }

    /* Vertical layout */
    .problems.vertical .problem {
      display: grid;
      grid-template-columns: 1fr 32px;
      gap: 6px 10px;
      min-height: 160px;
      justify-items: center;
      padding: 14px 12px;
    }

    .problems.vertical .expression {
      grid-column: 1;
      justify-self: end;
      display: grid;
      grid-template-columns: 28px minmax(60px, max-content);
      gap: 0 8px;
      min-width: 110px;
      text-align: right;
      line-height: 1.15;
      font-size: 24px;
      color: #2d3436;
    }

    .problems.vertical .first { grid-column: 2; }
    .problems.vertical .op { grid-column: 1; grid-row: 2; }
    .problems.vertical .second {
      grid-column: 2;
      grid-row: 2;
      border-bottom: 3px solid #2d3436;
      padding-bottom: 4px;
    }
    .problems.vertical .answer {
      grid-column: 1;
      justify-self: end;
      margin-top: 6px;
      text-align: right;
    }
    .problems.vertical .result {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
    }

    input.answer {
      appearance: none;
      width: 100px;
      height: 50px;
      padding: 0 4px;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      border: 3px solid #e8e0e2;
      border-radius: 14px;
      background: #fcfafb;
      color: #2d3436;
      outline: none;
      transition: border-color 0.2s;
    }
    input.answer:focus { border-color: var(--purple); }

    .result {
      width: 32px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
    }
    .correct .result { color: var(--correct); }
    .wrong .result { color: var(--wrong); }

    .empty-state {
      min-height: 260px;
      display: grid;
      place-items: center;
      border: 3px dashed #e0d6d9;
      border-radius: 20px;
      background: rgba(255,255,255,0.7);
      color: #bbb;
      text-align: center;
      padding: 24px;
      font-size: 18px;
      font-weight: 700;
    }

    .emoji-big { font-size: 60px; display: block; margin-bottom: 8px; }
    .stars { display: flex; gap: 2px; justify-content: center; margin-top: 4px; }
    .stars .star { font-size: 20px; transition: all 0.3s; opacity: 0.2; }
    .stars .star.lit { opacity: 1; }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .app:not(.practicing) main { display: none; }
      .sidebar { border-right: 0; border-bottom: 3px solid #c8e6c9; }
      main { padding: 20px; }
    }

    @media (max-width: 520px) {
      main { padding: 12px; }
      .problems.horizontal, .problems.vertical { grid-template-columns: 1fr; }
      .problems.horizontal .problem { grid-template-columns: minmax(0, 1fr) 72px 26px; gap: 6px; padding: 10px; }
      .problems.horizontal .expression { gap: 4px; font-size: clamp(18px, 5vw, 22px); }
      .problems.horizontal .problem.mcq { grid-template-columns: minmax(0, 1fr) 26px; }
      .problems.horizontal .problem.find-x { grid-template-columns: minmax(0, 1fr) 26px; }
      .mcq-btn { width: 46px; min-height: 44px; font-size: 18px; }
      .problems.vertical .expression { font-size: 20px; }
      input.answer { width: 72px; height: 44px; font-size: 22px; }
    }
    @media (max-width: 360px) {
      .problems.horizontal .problem { grid-template-columns: minmax(0, 1fr) 26px; }
      .problems.horizontal .expression { grid-column: 1 / -1; }
      .problems.horizontal .answer { grid-column: 1; grid-row: 2; }
      .problems.horizontal .result { grid-column: 2; grid-row: 2; }
    }
  </style>

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="nav-link ui-button" href="index.html">← Trang chủ</a>
      <h1 class="brand">Luyện cộng trừ và tìm x <small>Chọn phạm vi phù hợp với bé</small></h1>

      <div class="field">
        <label for="scope">🔢 Phạm vi ôn tập</label>
        <select id="scope">
          <option value="add10">Làm quen cộng qua 10</option>
          <option value="subtract10">Làm quen trừ qua 10</option>
          <option value="two" selected>Cộng trừ 2 chữ số</option>
          <option value="three">Cộng trừ 3 chữ số</option>
          <option value="findAddend">Tìm số hạng x</option>
          <option value="findMinuend">Tìm số bị trừ x</option>
          <option value="findSubtrahend">Tìm số trừ x</option>
        </select>
        <p class="hint" id="scopeHelp">Hai số từ 10–99; chọn cộng, trừ hoặc ngẫu nhiên.</p>
      </div>

      <div class="field" id="operation-field">
        <label for="operation">🧮 Dạng phép toán</label>
        <select id="operation">
          <option value="mixed">➕➖ Cộng và trừ</option>
          <option value="add">➕ Chỉ phép cộng</option>
          <option value="subtract">➖ Chỉ phép trừ</option>
        </select>
      </div>

      <div class="field">
        <label for="count">📝 Số câu</label>
        <input id="count" type="number" min="1" max="60" value="12">
      </div>

      <fieldset class="field" id="layout-field">
        <legend>📐 Cách hiển thị</legend>
        <div class="segmented">
          <label class="choice">
            <input type="radio" name="layout" value="vertical" checked>
            〰️ Hàng dọc
          </label>
          <label class="choice">
            <input type="radio" name="layout" value="horizontal">
            ↔️ Hàng ngang
          </label>
        </div>
      </fieldset>

      <fieldset class="field" id="answer-mode-field" hidden>
        <legend>🎯 Kiểu đề</legend>
        <div class="segmented">
          <label class="choice"><input type="radio" name="mode" value="input" checked>✏️ Tự nhập</label>
          <label class="choice"><input type="radio" name="mode" value="mcq">🎲 Trắc nghiệm</label>
        </div>
      </fieldset>

      <div class="actions">
        <button class="btn-purple ui-button ui-button--primary" id="generateBtn" type="button">✨ Tạo đề mới</button>
      </div>
    </aside>

    <main>
      <div class="session-actions ui-actions ui-actions--sticky">
        <a class="ui-button" href="index.html">← Trang chủ</a>
        <button class="ui-button" id="settingsBtn" type="button">⚙️ Cài đặt</button>
        <button class="ui-button" id="regenerateBtn" type="button">✨ Tạo đề mới</button>
        <button class="ui-button ui-button--primary" id="gradeBtn" type="button">✅ Chấm điểm</button>
      </div>
      <div class="topbar">
        <h2 id="practiceTitle">🧮 Luyện cộng trừ</h2>
        <p class="hint" id="hintText">Nhập đáp án vào ô trống rồi bấm ✅ Chấm điểm nhé!</p>
        <div class="score" id="scoreBox">🌟 Chưa có đề bài.</div>
      </div>

      <section id="problems" class="problems vertical" aria-live="polite">
        <div class="empty-state">
          <span class="emoji-big">📚</span>
          Bấm ✨ Tạo đề mới để bắt đầu luyện tập!
        </div>
      </section>
    </main>
  </div>

  <script>
    const app = document.querySelector('.app');
    const scopeEl = document.getElementById('scope');
    const operationEl = document.getElementById('operation');
    const countEl = document.getElementById('count');
    const generateBtn = document.getElementById('generateBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const gradeBtn = document.getElementById('gradeBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const problemsEl = document.getElementById('problems');
    const scoreBox = document.getElementById('scoreBox');
    const hintText = document.getElementById('hintText');

    let problems = [];
    let currentLayout = 'vertical';
    let currentMode = 'input';
    let currentScope = 'two';

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function isBasic(scope) {
      return scope === 'add10' || scope === 'subtract10';
    }

    function isFindX(scope) {
      return scope === 'findAddend' || scope === 'findMinuend' || scope === 'findSubtrahend';
    }

    function updateScopeSettings() {
      const basic = isBasic(scopeEl.value);
      const findX = isFindX(scopeEl.value);
      document.getElementById('operation-field').hidden = basic || findX;
      document.getElementById('layout-field').hidden = basic || findX;
      document.getElementById('answer-mode-field').hidden = !basic;
      const help = {
        add10: 'Hai số từ 1–9, tổng từ 10–18.',
        subtract10: 'Số từ 10–18 trừ số từ 1–9, kết quả từ 1–9.',
        two: 'Hai số từ 10–99; chọn cộng, trừ hoặc ngẫu nhiên.',
        three: 'Hai số từ 100–999; chọn cộng, trừ hoặc ngẫu nhiên.',
        findAddend: 'Tìm số hạng còn thiếu. Ví dụ: 12 + x = 30.',
        findMinuend: 'Tìm số bị trừ. Ví dụ: x − 15 = 30.',
        findSubtrahend: 'Tìm số trừ. Ví dụ: 60 − x = 17.',
      };
      document.getElementById('scopeHelp').textContent = help[scopeEl.value];
    }

    function getSelectedLayout() {
      return document.querySelector('input[name="layout"]:checked').value;
    }

    function createProblem(scope, operationMode, prev) {
      if (isBasic(scope)) {
        let first, second, attempts = 0;
        do {
          first = scope === 'add10' ? randomInt(1, 9) : randomInt(10, 18);
          second = scope === 'add10' ? randomInt(Math.max(1, 10 - first), 9) : randomInt(first - 9, 9);
          attempts++;
        } while (prev && first === prev.first && second === prev.second && attempts < 50);
        return { first, second, operator: scope === 'add10' ? '+' : '−', answer: scope === 'add10' ? first + second : first - second };
      }

      if (scope === 'findAddend') {
        const total = randomInt(20, 99);
        const known = randomInt(10, total - 1);
        const missingFirst = Math.random() < 0.5;
        return { first: missingFirst ? 'x' : known, second: missingFirst ? known : 'x', operator: '+', total, answer: total - known, findX: true };
      }
      if (scope === 'findMinuend') {
        const second = randomInt(10, 89);
        const total = randomInt(10, 99 - second);
        return { first: 'x', second, operator: '−', total, answer: second + total, findX: true };
      }
      if (scope === 'findSubtrahend') {
        const first = randomInt(20, 99);
        const total = randomInt(10, first - 1);
        return { first, second: 'x', operator: '−', total, answer: first - total, findX: true };
      }

      const range = scope === 'three' ? { min: 100, max: 999 } : { min: 10, max: 99 };
      let operator = operationMode;
      if (operator === 'mixed') operator = Math.random() > 0.5 ? 'add' : 'subtract';

      if (operator === 'add') {
        const first = randomInt(range.min, range.max - range.min);
        const second = randomInt(range.min, range.max - first);
        return { first, second, operator: '+', answer: first + second };
      }

      const first = randomInt(range.min * 2, range.max);
      const second = randomInt(range.min, first - range.min);
      return { first, second, operator: '-', answer: first - second };
    }

    function generateDistractors(correctAnswer, scope) {
      const min = scope === 'add10' ? 10 : 1;
      const max = scope === 'add10' ? 18 : 9;
      const distractors = new Set();
      while (distractors.size < 2) {
        const value = randomInt(min, max);
        if (value !== correctAnswer) distractors.add(value);
      }
      return [...distractors];
    }

    function shuffle(values) {
      for (let i = values.length - 1; i > 0; i--) {
        const j = randomInt(0, i);
        [values[i], values[j]] = [values[j], values[i]];
      }
      return values;
    }

    function hintFormula(problem) {
      if (problem.operator === '+') {
        return `x = ${problem.total} − ${problem.first === 'x' ? problem.second : problem.first}`;
      }
      return problem.first === 'x'
        ? `x = ${problem.total} + ${problem.second}`
        : `x = ${problem.first} − ${problem.total}`;
    }

    function expressionTemplate(problem, layout) {
      if (problem.findX) {
        return `<div class="expression"><span>${problem.first}</span><span>${problem.operator}</span><span>${problem.second}</span><span>=</span><span>${problem.total}</span><span class="hint-formula" role="status" hidden>${hintFormula(problem)}</span></div>`;
      }
      if (layout === 'vertical') {
        return `
          <div class="expression">
            <span class="first">${problem.first}</span>
            <span class="op">${problem.operator}</span>
            <span class="second">${problem.second}</span>
          </div>`;
      }
      return `
        <div class="expression">
          <span>${problem.first}</span>
          <span>${problem.operator}</span>
          <span>${problem.second}</span>
          <span>=</span>
        </div>`;
    }

    function renderStarRating(correct, total) {
      const pct = total > 0 ? correct / total : 0;
      let stars = '';
      for (let i = 0; i < 5; i++) {
        stars += `<span class="star ${i < Math.round(pct * 5) ? 'lit' : ''}">⭐</span>`;
      }
      return stars;
    }

    function renderProblems() {
      problemsEl.className = `problems ${currentLayout}`;

      if (problems.length === 0) {
        problemsEl.innerHTML = `<div class="empty-state"><span class="emoji-big">📚</span>Bấm ✨ Tạo đề mới để bắt đầu luyện tập!</div>`;
        return;
      }

      if (currentMode === 'input') {
        problemsEl.innerHTML = problems.map((problem, index) => `
          <article class="problem ${problem.findX ? 'find-x' : ''}" data-index="${index}">
            ${expressionTemplate(problem, currentLayout)}
            ${problem.findX ? `<div class="find-hint"><button class="ui-button hint-button" type="button" aria-label="Xem gợi ý câu ${index + 1}">💡 Gợi ý</button></div>` : ''}
            ${problem.findX
              ? `<label class="x-answer">x = <input class="answer" type="number" inputmode="numeric" aria-label="Giá trị x câu ${index + 1}"></label>`
              : `<input class="answer" type="number" inputmode="numeric" aria-label="Đáp án câu ${index + 1}">`}
            <span class="result" aria-hidden="true"></span>
          </article>
        `).join('');
        return;
      }

      problemsEl.innerHTML = problems.map((problem, index) => {
        const options = shuffle([problem.answer, ...generateDistractors(problem.answer, currentScope)]);
        return `
          <article class="problem mcq" data-index="${index}">
            ${expressionTemplate(problem, 'horizontal')}
            <div class="mcq-options" role="radiogroup" aria-label="Đáp án câu ${index + 1}">
              ${options.map(value => `<button class="mcq-btn" type="button" data-value="${value}" role="radio" aria-checked="false">${value}</button>`).join('')}
            </div>
            <span class="result" aria-hidden="true"></span>
          </article>
        `;
      }).join('');
      problemsEl.querySelectorAll('.mcq-options').forEach(group => {
        const buttons = group.querySelectorAll('.mcq-btn');
        buttons.forEach(button => button.addEventListener('click', () => {
          buttons.forEach(item => { item.classList.remove('selected'); item.setAttribute('aria-checked', 'false'); });
          button.classList.add('selected');
          button.setAttribute('aria-checked', 'true');
        }));
      });
    }

    function generateProblems() {
      const count = Math.min(60, Math.max(1, Math.trunc(Number(countEl.value)) || 1));
      countEl.value = count;
      currentScope = scopeEl.value;
      currentMode = isBasic(currentScope) ? document.querySelector('input[name="mode"]:checked').value : 'input';
      currentLayout = isBasic(currentScope) || isFindX(currentScope) ? 'horizontal' : getSelectedLayout();
      const titles = { add10: 'Cộng qua 10', subtract10: 'Trừ qua 10', two: 'Cộng trừ 2 chữ số', three: 'Cộng trừ 3 chữ số', findAddend: 'Tìm số hạng x', findMinuend: 'Tìm số bị trừ x', findSubtrahend: 'Tìm số trừ x' };
      document.getElementById('practiceTitle').textContent = `🧮 ${titles[currentScope]}`;

      problems = [];
      for (let i = 0; i < count; i++) {
        problems.push(createProblem(currentScope, operationEl.value, problems[i - 1]));
      }
      scoreBox.innerHTML = `🌟 Đã tạo <strong>${count}</strong> câu.`;
      hintText.textContent = isFindX(currentScope)
        ? 'Tìm giá trị x rồi nhập vào ô trống. Bấm 💡 Gợi ý nếu cần.'
        : currentMode === 'mcq'
        ? 'Chọn đáp án đúng cho mỗi câu rồi bấm ✅ Chấm điểm!'
        : 'Nhập đáp án vào ô trống rồi bấm ✅ Chấm điểm nhé!';
      renderProblems();
      app.classList.add('practicing');

      const firstAnswer = problemsEl.querySelector('.answer, .mcq-btn');
      if (firstAnswer) firstAnswer.focus();
    }

    function gradeProblems() {
      if (problems.length === 0) {
        scoreBox.textContent = '😅 Hãy bấm ✨ Tạo đề mới trước khi chấm điểm nhé!';
        return;
      }

      let correct = 0;
      const cards = problemsEl.querySelectorAll('.problem');

      cards.forEach((card) => {
        const index = Number(card.dataset.index);
        const result = card.querySelector('.result');
        let isCorrect = false;
        if (currentMode === 'input') {
          const input = card.querySelector('.answer');
          isCorrect = input.value.trim() !== '' && Number(input.value) === problems[index].answer;
        } else {
          const selected = card.querySelector('.mcq-btn.selected');
          if (selected) {
            isCorrect = Number(selected.dataset.value) === problems[index].answer;
            selected.classList.toggle('correct', isCorrect);
            selected.classList.toggle('wrong', !isCorrect);
          }
        }

        card.classList.toggle('correct', isCorrect);
        card.classList.toggle('wrong', !isCorrect);
        result.textContent = isCorrect ? '✅' : '❌';

        if (isCorrect) correct += 1;
      });

      const pct = correct / problems.length;
      const msg = pct === 1 ? '🎉🎉🎉 Xuất sắc! Làm bài quá giỏi!' :
                  pct >= 0.8 ? '🎉 Làm tốt lắm! Cố gắng thêm nhé!' :
                  pct >= 0.5 ? '💪 Cố gắng hơn nữa nào!' :
                  '😊 Bé cần luyện thêm. Cố lên!';

      scoreBox.innerHTML = `
        <div>${msg}</div>
        <div style="margin-top:4px;"><strong>${correct}/${problems.length}</strong> câu đúng</div>
        <div class="stars">${renderStarRating(correct, problems.length)}</div>
      `;
    }

    generateBtn.addEventListener('click', generateProblems);
    regenerateBtn.addEventListener('click', generateProblems);
    gradeBtn.addEventListener('click', gradeProblems);
    problemsEl.addEventListener('click', event => {
      const button = event.target.closest('.hint-button');
      if (!button) return;
      button.closest('.problem').querySelector('.hint-formula').hidden = false;
      button.disabled = true;
    });
    scopeEl.addEventListener('change', updateScopeSettings);
    const linkedScope = window.location.hash.slice(1);
    if (['add10', 'subtract10', 'two', 'three', 'findAddend', 'findMinuend', 'findSubtrahend'].includes(linkedScope)) scopeEl.value = linkedScope;
    updateScopeSettings();
    settingsBtn.addEventListener('click', () => {
      app.classList.remove('practicing');
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
