<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Phép Cộng Gộp 10 Thần Kỳ 🍭</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --bg-color: #f7f9fc;
            --text-color: #2d3436;
            --accent-color: #ffeaa7;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        h1 {
            color: #d63031;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #636e72;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        .side-panel {
            width: 100%;
        }

        .content-panel {
            width: 100%;
            min-width: 0;
        }

        /* Bảng điều khiển nhập số */
        .control-panel {
            background: #f1f2f6;
            padding: 16px 20px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #btn-next { grid-column: 1 / -1; }

        input[type="number"] {
            width: 88px;
            height: 60px;
            font-size: 1.75rem;
            text-align: center;
            border: 3px solid #b2bec3;
            border-radius: 10px;
            font-weight: bold;
            color: #2d3436;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .math-sign {
            font-size: 2rem;
            font-weight: bold;
            color: #2d3436;
        }

        button {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            border: none;
            width: 100%;
            min-height: 54px;
            padding: 10px 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        button:focus-visible,
        input[type="number"]:focus-visible {
            outline: 4px solid rgba(9, 132, 227, .3);
            outline-offset: 2px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: #b2bec3;
            box-shadow: none;
            cursor: not-allowed;
        }

        #btn-reset {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.35);
        }

        #btn-reset:hover {
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.5);
        }

        #btn-next {
            width: 100%;
            background: linear-gradient(135deg, #00b894, #00a884);
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.35);
        }

        /* Khung 10 ô */
        .workspace {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .frame-wrapper {
            background: #fdfdfd;
            border: 3px dashed #dfe6e9;
            padding: 15px;
            border-radius: 15px;
            position: relative;
        }

        .frame-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2d3436;
        }

        .ten-frame {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 6px;
            background-color: #dfe6e9;
            padding: 8px;
            border-radius: 10px;
            border: 3px solid #b2bec3;
            position: relative;
            transition: all 0.5s ease;
        }

        .cell {
            background-color: white;
            border-radius: 8px;
            border: 1px solid #b2bec3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background-color .3s, opacity .3s, transform .3s;
        }

        .cell.need-cell {
            background: #e8f8f5;
            box-shadow: inset 0 0 0 3px #00b894;
            animation: pulse 1s infinite alternate;
        }

        /* Kẹo mút và hiệu ứng bay */
        .apple {
            font-size: 2.2rem;
            user-select: none;
            z-index: 10;
            display: inline-block;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .apple.moving {
            z-index: 999;
            transform: scale(1.3);
        }

        .cell.split-to-ten {
            background: #74b9ff;
        }

        .cell.split-remain {
            background: #ffe066;
        }

        .ten-frame.dimmed { opacity: .35; }

        .cell.remaining-focus {
            background: #ffe066;
            transform: scale(1.06);
            animation: pulse 1s infinite alternate;
        }

        .split-legend {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: .85rem;
            font-weight: 700;
        }

        .split-legend[hidden] { display: none; }

        .legend-to-ten,
        .part-to-ten { color: #073b66; background: #74b9ff; }
        .legend-remain,
        .part-remain { color: #694300; background: #ffe066; }
        .part-to-ten,
        .part-remain { padding: 0 .15em; border-radius: 4px; }
        .legend-to-ten,
        .legend-remain { padding: 4px 8px; border-radius: 8px; }
        .legend-to-ten { background: #74b9ff; }
        .legend-remain { background: #ffe066; }

        .step-hint {
            margin: 10px 0 0;
            color: #636e72;
            font-size: .95rem;
            font-weight: 700;
            text-align: center;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            to { opacity: .45; }
        }

        /* Lời giảng giải */
        .explanation-box {
            background: var(--accent-color);
            border-left: 6px solid #fdcb6e;
            padding: 15px 20px;
            border-radius: 8px;
            text-align: left;
            margin-top: 20px;
            min-height: 80px;
            font-size: 1.15rem;
            line-height: 1.6;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .step-text {
            margin: 5px 0;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.5s ease;
        }

        .step-text.show {
            opacity: .42;
            transform: translateY(0);
        }

        .step-text.current.show { opacity: 1; }

        #title-count-left.counting {
            display: inline-block;
            animation: count-pop .35s ease;
        }

        @keyframes count-pop {
            50% { transform: scale(1.7); }
        }

        /* Công thức toán thời gian thực */
        .formula-display {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 20px 0;
            color: #2d3436;
            min-height: 50px;
        }

        .highlight-red { color: #d63031; }
        .highlight-green { color: #27ae60; }
        .highlight-blue { color: #0984e3; font-size: 2.5rem; }

        @media (max-width: 650px) {
            body { padding: 10px; }
            .container { padding: 16px; }
            .control-panel { grid-template-columns: 1fr; }
            .input-row { gap: 8px; }
            input[type="number"] { width: 72px; height: 56px; }
            #btn-next { grid-column: auto; }
            .workspace { gap: 20px; }
            .frame-wrapper { padding: 8px; }
            .ten-frame {
                grid-template-columns: repeat(5, 40px);
                grid-template-rows: repeat(2, 40px);
                gap: 4px;
            }
            .apple { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" style="display:inline-block;margin-bottom:12px;color:#0984e3;text-decoration:none;font-size:14px;font-weight:700;">&larr; Về trang chủ</a>
        <h1>🍭 Phép Cộng Thần Kỳ: Tạo Nhóm 10 🍭</h1>
        <div class="subtitle">Phương pháp tách số trực quan giúp bé học giỏi toán cộng qua 10!</div>

        <div class="main-layout">
            <div class="side-panel">
                <div class="control-panel">
                    <div class="input-row">
                        <input type="number" id="num1" value="7" min="1" max="9" inputmode="numeric" aria-label="Số thứ nhất">
                        <span class="math-sign">+</span>
                        <input type="number" id="num2" value="5" min="1" max="9" inputmode="numeric" aria-label="Số thứ hai">
                    </div>
                    <div class="button-row">
                        <button id="btn-start" onclick="runAdditionVisualizer()">Xem Phép Tính ✨</button>
                        <button id="btn-reset" type="button" onclick="resetVisualizer()">Reset</button>
                    </div>
                    <button id="btn-next" type="button" hidden>Bước tiếp theo ▶</button>
                </div>
                <div class="explanation-box" id="explanation" aria-live="polite">
                    <div style="color: #b2bec3; text-align: center; padding-top: 10px;">Nhập số từ 1 đến 9 và bấm nút để bắt đầu nhé bé!</div>
                </div>
            </div>
            <div class="content-panel">
                <div class="formula-display" id="live-formula"></div>

        <div class="workspace">
            <div class="frame-wrapper">
                <div class="frame-title">Khung 1: <span id="title-count-left" class="highlight-red">0</span> Kẹo Mút Đỏ</div>
                <div id="frame-left" class="ten-frame"></div>
            </div>
            <div class="frame-wrapper">
                <div class="frame-title">Khung 2: <span id="title-count-right" class="highlight-green">0</span> Kẹo Mút Xanh</div>
                <div id="frame-right" class="ten-frame"></div>
                <div id="split-legend" class="split-legend" hidden>
                    <span class="legend-to-ten">Sang gộp</span>
                    <span class="legend-remain">Còn lại</span>
                </div>
            </div>
        </div>

            </div>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        const defaultExplanation = '<div style="color: #b2bec3; text-align: center; padding-top: 10px;">Nhập số từ 1 đến 9 và bấm nút để bắt đầu nhé bé!</div>';
        const nextBtn = document.getElementById('btn-next');
        let cancelStepWait = null;

        function waitForNext(expBox) {
            const hint = document.createElement('p');
            hint.className = 'step-hint';
            hint.textContent = 'Bấm nút hoặc nhấn Space / Enter';
            expBox.appendChild(hint);
            nextBtn.hidden = false;

            return new Promise((resolve) => {
                const finish = (continueRun) => {
                    window.removeEventListener('keydown', onKeyDown);
                    nextBtn.removeEventListener('click', onNext);
                    nextBtn.hidden = true;
                    hint.remove();
                    cancelStepWait = null;
                    resolve(continueRun);
                };
                const onKeyDown = (event) => {
                    if (!event.repeat && (event.code === 'Space' || event.key === 'Enter')) {
                        event.preventDefault();
                        finish(true);
                    }
                };
                const onNext = () => finish(true);
                cancelStepWait = () => finish(false);
                window.addEventListener('keydown', onKeyDown);
                nextBtn.addEventListener('click', onNext);
                nextBtn.focus();
            });
        }

        function resetVisualizer() {
            if (cancelStepWait) cancelStepWait();
            nextBtn.hidden = true;
            document.getElementById('split-legend').hidden = true;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('num1').value = 7;
            document.getElementById('num2').value = 5;
            document.getElementById('title-count-left').innerText = 0;
            document.getElementById('title-count-right').innerText = 0;
            document.getElementById('live-formula').innerHTML = '';
            document.getElementById('explanation').innerHTML = defaultExplanation;
            genGrid('frame-left');
            genGrid('frame-right');
        }

        function genGrid(frameId, receiver) {
            const frame = document.getElementById(frameId);
            frame.innerHTML = '';
            frame.style.borderColor = '#b2bec3';
            frame.style.backgroundColor = '#dfe6e9';
            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `${frameId}-cell-${i}`;
                frame.appendChild(cell);
            }
        }

        async function runAdditionVisualizer() {
            const btn = document.getElementById('btn-start');
            btn.disabled = true;

            let n1 = parseInt(document.getElementById('num1').value);
            let n2 = parseInt(document.getElementById('num2').value);

            if (isNaN(n1) || n1 < 1 || n1 > 9 || isNaN(n2) || n2 < 1 || n2 > 9) {
                alert("Bé ơi, hãy nhập các số từ 1 đến 9 nhé!");
                btn.disabled = false;
                return;
            }

            const expBox = document.getElementById('explanation');
            const formula = document.getElementById('live-formula');
            expBox.innerHTML = '';
            formula.innerHTML = `<span class="highlight-red">${n1}</span> + <span class="highlight-green">${n2}</span> = ?`;

            genGrid('frame-left');
            genGrid('frame-right');

            // Giữ nguyên thứ tự phép tính: tách số thứ hai để gộp số thứ nhất thành 10.
            const need = 10 - n1;
            const rem = n2 - need;

            // place lollipops
            for (let i = 0; i < n1; i++) {
                const cell = document.getElementById(`frame-left-cell-${i}`);
                cell.innerHTML = `<span class="apple" id="apple-left-${i}">🍭</span>`;
            }
            for (let i = 0; i < n2; i++) {
                const cell = document.getElementById(`frame-right-cell-${i}`);
                cell.innerHTML = `<span class="apple" id="apple-right-${i}">🍭</span>`;
            }

            document.getElementById('title-count-left').innerText = n1;
            document.getElementById('title-count-right').innerText = n2;

            if (!await waitForNext(expBox)) return;

            // CASE 1: sum <= 10
            if (n1 + n2 <= 10) {
                addStepText(expBox, `👉 Khung trái có <b>${n1}</b> 🍭, khung phải có <b>${n2}</b> 🍭.`);
                if (!await waitForNext(expBox)) return;
                addStepText(expBox, `👉 Cùng đếm gộp tất cả kẹo mút lại nhé!`);
                if (!await waitForNext(expBox)) return;

                for (let i = 0; i < n2; i++) {
                    const idx = n1 + i;
                    const el = document.getElementById(`apple-right-${i}`);
                    const cell = document.getElementById(`frame-left-cell-${idx}`);
                    await moveApple(el, cell);
                    document.getElementById('title-count-left').innerText = idx + 1;
                    document.getElementById('title-count-right').innerText = n2 - (i + 1);
                    await sleep(300);
                }

                formula.innerHTML = `<span class="highlight-red">${n1}</span> + <span class="highlight-green">${n2}</span> = <span class="highlight-blue">${n1 + n2}</span>`;
                addStepText(expBox, `🎉 Có tất cả <b class="highlight-blue">${n1 + n2}</b> kẹo mút! Vậy <b>${n1} + ${n2} = ${n1 + n2}</b>.`);
                btn.disabled = false;
                return;
            }

            // CASE 2: sum > 10
            for (let i = n1; i < 10; i++) {
                document.getElementById(`frame-left-cell-${i}`).classList.add('need-cell');
            }
            addStepText(expBox, `👉 Khung trái có <b class="highlight-red">${n1}</b> 🍭, cần thêm <b>${need}</b> để được 10.`);
            if (!await waitForNext(expBox)) return;

            addStepText(expBox, `👉 Tách <b class="highlight-green">${n2}</b> 🍭 = <b class="part-to-ten">${need}</b> (sang gộp) + <b class="part-remain">${rem}</b> (còn lại).`);
            formula.innerHTML = `<span class="highlight-red">${n1}</span> + (<span class="part-to-ten">${need}</span> + <span class="part-remain">${rem}</span>) = ?`;

            // Tách trực quan số cho thành hai nhóm: sang gộp và còn lại.
            for (let i = 0; i < n2; i++) {
                const el = document.getElementById(`apple-right-${i}`);
                if (el) el.parentElement.classList.add(i < need ? 'split-to-ten' : 'split-remain');
            }
            document.getElementById('split-legend').hidden = false;
            if (!await waitForNext(expBox)) return;

            addStepText(expBox, `🚀 Di chuyển <b>${need}</b> kẹo mút 🍭 sang lấp đầy khung 10!`);
            formula.innerHTML = `(<span class="highlight-red">${n1}</span> + <span class="part-to-ten">${need}</span>) + <span class="part-remain">${rem}</span> = ?`;
            if (!await waitForNext(expBox)) return;

            document.getElementById('split-legend').hidden = true;
            for (let i = 0; i < need; i++) {
                const el = document.getElementById(`apple-right-${i}`);
                const cell = document.getElementById(`frame-left-cell-${n1 + i}`);
                el.parentElement.classList.remove('split-to-ten');
                cell.classList.remove('need-cell');
                await moveApple(el, cell);
                animateCount(n1 + i + 1);
                document.getElementById('title-count-right').innerText = n2 - (i + 1);
                await sleep(350);
            }
            await sleep(500);

            // highlight the full 10-frame
            const recvFrame = document.getElementById('frame-left');
            recvFrame.style.borderColor = '#27ae60';
            recvFrame.style.backgroundColor = '#e8f8f5';

            addStepText(expBox, `✨ Khung trái đã đầy <b>10</b> kẹo mút!`);
            formula.innerHTML = `<span class="highlight-red">10</span> + <span class="highlight-green">${rem}</span> = ?`;
            if (!await waitForNext(expBox)) return;

            addStepText(expBox, `👉 Còn lại <b>${rem}</b> kẹo mút 🍭 ở khung phải.`);
            recvFrame.classList.add('dimmed');
            document.querySelectorAll('#frame-right .split-remain').forEach(cell => cell.classList.add('remaining-focus'));
            if (!await waitForNext(expBox)) return;

            addStepText(expBox, `🎉 <b>10 + ${rem} = ${n1 + n2}</b>! Vậy <b>${n1} + ${n2} = ${n1 + n2}</b>.`);
            formula.innerHTML = `<span class="highlight-red">${n1}</span> + <span class="highlight-green">${n2}</span> = <span class="highlight-blue">${n1 + n2}</span>`;
            recvFrame.classList.remove('dimmed');
            document.querySelectorAll('.remaining-focus').forEach(cell => cell.classList.remove('remaining-focus', 'split-remain'));
            btn.disabled = false;
        }

        function addStepText(container, text) {
            container.querySelectorAll('.step-text.current').forEach(step => step.classList.remove('current'));
            const p = document.createElement('p');
            p.className = 'step-text current';
            p.innerHTML = text;
            container.appendChild(p);
            setTimeout(() => p.classList.add('show'), 50);
            container.scrollTop = container.scrollHeight;
        }

        function animateCount(value) {
            const count = document.getElementById('title-count-left');
            count.innerText = value;
            count.classList.remove('counting');
            void count.offsetWidth;
            count.classList.add('counting');
        }

        function moveApple(el, targetCell) {
            return new Promise((resolve) => {
                if (!el || !targetCell) { resolve(); return; }

                const start = el.getBoundingClientRect();
                const end = targetCell.getBoundingClientRect();
                const dx = end.left - start.left + (targetCell.offsetWidth / 2 - el.offsetWidth / 2);
                const dy = end.top - start.top + (targetCell.offsetHeight / 2 - el.offsetHeight / 2);

                el.classList.add('moving');
                el.style.transform = `translate(${dx}px, ${dy}px) scale(1.2)`;

                el.addEventListener('transitionend', function handler() {
                    el.removeEventListener('transitionend', handler);
                    el.classList.remove('moving');
                    el.style.transform = 'none';
                    targetCell.appendChild(el);
                    resolve();
                });
            });
        }

        resetVisualizer();
    </script>
</body>
</html>
