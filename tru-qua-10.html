<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trừ qua 10 - Bé học toán</title>
  <style>

    :root {
      --pink: #ff6b9d;
      --orange: #ff9a56;
      --yellow: #ffd93d;
      --green: #6bcb77;
      --blue: #4d96ff;
      --purple: #9b59b6;
      --bg-start: #fce4ec;
      --bg-end: #e8eaf6;
      --card-bg: #ffffff;
      --shadow: 0 8px 30px rgba(0,0,0,0.1);
      --correct: #27ae60;
      --wrong: #e74c3c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: #2d3436;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }
    .app.practicing { grid-template-columns: minmax(0, 1fr); }
    .app.practicing .sidebar { display: none; }

    .sidebar {
      background: linear-gradient(180deg, #fff5f7, #fff);
      border-right: 3px solid #fce4ec;
      padding: 24px 20px;
      box-shadow: 4px 0 20px rgba(0,0,0,0.05);
    }

    .brand small { display: block; font-size: 13px; color: #999; font-weight: 600; margin-top: 2px; }

    .nav-link {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .nav-link:hover { color: #2e6bd4; }

    .brand {
      margin: 0 0 4px;
      font-size: 26px;
      color: var(--pink);
      text-shadow: 2px 2px 0 #f8ceda;
    }

    .field { margin-bottom: 16px; }

    .field label, .field legend {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 800;
      color: #666;
    }

    fieldset { border: 0; padding: 0; margin: 0; }

    input[type="number"] {
      width: 100%;
      height: 46px;
      border: 3px solid #f0e6e8;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 18px;
      font-weight: 800;
      background: #fcfafb;
      color: #2d3436;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus { border-color: var(--pink); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { margin: 0; appearance: none; }
    input[type="number"] { appearance: textfield; }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .choice {
      position: relative;
      display: block;
      height: 44px;
      border: 3px solid #f0e6e8;
      border-radius: 12px;
      background: #fcfafb;
      cursor: pointer;
      line-height: 38px;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      user-select: none;
      transition: all 0.15s;
    }
    .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .choice:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
    .choice:has(input:checked) {
      border-color: var(--pink);
      background: #fce4ec;
      color: var(--pink);
    }

    .actions { display: grid; gap: 8px; margin-top: 20px; }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    button:active { transform: scale(0.96); }

    .btn-pink {
      background: linear-gradient(135deg, var(--pink), #e84393);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255,107,157,0.4);
    }
    .btn-pink:hover { box-shadow: 0 6px 20px rgba(255,107,157,0.5); }

    .btn-blue {
      background: linear-gradient(135deg, var(--blue), #2e6bd4);
      color: #fff;
      box-shadow: 0 4px 15px rgba(77,150,255,0.4);
    }
    .btn-blue:hover { box-shadow: 0 6px 20px rgba(77,150,255,0.5); }

    .btn-green {
      background: linear-gradient(135deg, var(--green), #27ae60);
      color: #fff;
      box-shadow: 0 4px 15px rgba(107,203,119,0.4);
    }
    .btn-green:hover { box-shadow: 0 6px 20px rgba(107,203,119,0.5); }

    .btn-yellow {
      background: linear-gradient(135deg, var(--yellow), #f9a825);
      color: #5d4e37;
      box-shadow: 0 4px 15px rgba(255,217,61,0.4);
    }
    .btn-yellow:hover { box-shadow: 0 6px 20px rgba(255,217,61,0.5); }

    .score {
      min-height: 48px;
      margin: 12px 0 20px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fcfafb;
      border: 2px dashed #f0e6e8;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.4;
      color: #888;
    }

    main { min-width: 0; padding: 28px; }

    .topbar { margin-bottom: 20px; }
    .session-actions { margin-bottom: 12px; }
    .app:not(.practicing) .session-actions { display: none; }
    .app.practicing .session-actions { display: flex; }
    .session-actions .ui-button { flex: 1 1 130px; }

    h2 {
      margin: 0 0 4px;
      font-size: 28px;
      color: var(--orange);
      text-shadow: 2px 2px 0 #ffe0b5;
    }

    .hint { margin: 0; color: #999; font-weight: 600; font-size: 15px; }

    .problems { display: grid; gap: 12px; }
    .problems.horizontal { grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); }

    .problem {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 100px 32px;
      align-items: center;
      gap: 12px;
      min-height: 82px;
      padding: 14px 18px;
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      border: 3px solid transparent;
      transition: border-color 0.25s, background 0.25s;
    }

    .problem.correct {
      border-color: var(--correct);
      background: #eafaf1;
    }
    .problem.wrong {
      border-color: var(--wrong);
      background: #fdedec;
    }

    .expression {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 30px;
      color: #2d3436;
      min-width: 0;
      overflow: hidden;
    }

    input.answer {
      appearance: none;
      width: 100px;
      height: 50px;
      padding: 0 4px;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      border: 3px solid #e8e0e2;
      border-radius: 14px;
      background: #fcfafb;
      color: #2d3436;
      outline: none;
      transition: border-color 0.2s;
    }
    input.answer:focus { border-color: var(--pink); }

    .mcq-options { display: flex; gap: 6px; }
    .problem:has(.mcq-options) { grid-template-columns: minmax(0, 1fr) 32px; }
    .problem:has(.mcq-options) .expression { grid-column: 1 / -1; }
    .problem:has(.mcq-options) .mcq-options { grid-column: 1; grid-row: 2; }
    .problem:has(.mcq-options) .result { grid-column: 2; grid-row: 2; }

    .mcq-btn {
      width: 54px;
      height: 50px;
      border: 3px solid #e8e0e2;
      border-radius: 14px;
      background: #fcfafb;
      color: #2d3436;
      font-size: 22px;
      cursor: pointer;
      text-align: center;
      line-height: 44px;
      padding: 0;
      transition: all 0.15s;
    }
    .mcq-btn:hover { border-color: var(--pink); background: #fce4ec; }
    .mcq-btn.selected { border-color: var(--pink); background: #fce4ec; }
    .mcq-btn.correct { border-color: var(--correct); background: #d5f5e3; }
    .mcq-btn.wrong { border-color: var(--wrong); background: #fadbd8; }

    .result {
      width: 32px;
      text-align: center;
      font-size: 24px;
      font-weight: 800;
    }
    .correct .result { color: var(--correct); }
    .wrong .result { color: var(--wrong); }

    .empty-state {
      min-height: 260px;
      display: grid;
      place-items: center;
      border: 3px dashed #e0d6d9;
      border-radius: 20px;
      background: rgba(255,255,255,0.7);
      color: #bbb;
      text-align: center;
      padding: 24px;
      font-size: 18px;
      font-weight: 700;
    }

    .stars { display: flex; gap: 2px; justify-content: center; margin-top: 4px; }
    .stars .star { font-size: 20px; transition: all 0.3s; opacity: 0.2; }
    .stars .star.lit { opacity: 1; }

    .emoji-big { font-size: 60px; display: block; margin-bottom: 8px; }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .app:not(.practicing) main { display: none; }
      .sidebar { border-right: 0; border-bottom: 3px solid #fce4ec; }
      main { padding: 20px; }
    }

    @media (max-width: 520px) {
      main { padding: 12px; }
      .problems.horizontal { grid-template-columns: 1fr; }
      .problem { grid-template-columns: minmax(0, 1fr) 72px 26px; gap: 6px; padding: 10px; }
      .expression { gap: 4px; font-size: clamp(20px, 6vw, 24px); }
      input.answer { width: 72px; height: 44px; font-size: 24px; }
      .mcq-btn { width: 46px; height: 44px; font-size: 18px; line-height: 38px; }
      .problem:has(.mcq-options) { grid-template-columns: minmax(0, 1fr) 26px; }
    }
  </style>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="nav-link ui-button" href="index.html">← Trang chủ</a>
      <h1 class="brand">Trừ qua 10 <small>Luyện tập toán vui</small></h1>

      <div class="field">
        <label for="count">📝 Số câu</label>
        <input id="count" type="number" min="1" max="60" value="12">
      </div>

      <fieldset class="field">
        <legend>🎯 Kiểu đề</legend>
        <div class="segmented">
          <label class="choice">
            <input type="radio" name="mode" value="input" checked>
            ✏️ Tự nhập
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="mcq">
            🎲 Trắc nghiệm
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <button class="btn-pink ui-button ui-button--primary" id="generateBtn" type="button">✨ Tạo đề mới</button>
      </div>
    </aside>

    <main>
      <div class="session-actions ui-actions ui-actions--sticky">
        <a class="ui-button" href="index.html">← Trang chủ</a>
        <button class="ui-button" id="settingsBtn" type="button">⚙️ Cài đặt</button>
        <button class="ui-button" id="regenerateBtn" type="button">✨ Tạo đề mới</button>
        <button class="ui-button ui-button--primary" id="gradeBtn" type="button">✅ Chấm điểm</button>
      </div>
      <div class="topbar">
        <h2>🧮 Phép trừ qua 10</h2>
        <p class="hint" id="hintText">Nhập đáp án vào ô trống rồi bấm ✅ Chấm điểm nhé!</p>
        <div class="score" id="scoreBox">🌟 Chưa có đề bài.</div>
      </div>

      <section id="problems" class="problems horizontal" aria-live="polite">
        <div class="empty-state">
          <span class="emoji-big">📚</span>
          Bấm ✨ Tạo đề mới để bắt đầu luyện tập!
        </div>
      </section>
    </main>
  </div>

  <script>
    const app = document.querySelector('.app');
    const countEl = document.getElementById('count');
    const generateBtn = document.getElementById('generateBtn');
    const regenerateBtn = document.getElementById('regenerateBtn');
    const gradeBtn = document.getElementById('gradeBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const problemsEl = document.getElementById('problems');
    const scoreBox = document.getElementById('scoreBox');
    const hintText = document.getElementById('hintText');

    let problems = [];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createProblem(prev) {
      let a, b, attempts = 0;
      do {
        a = randomInt(10, 18);
        b = randomInt(a - 9, 9);
        attempts++;
      } while (prev && a === prev.first && b === prev.second && attempts < 50);
      return { first: a, second: b, operator: '-', answer: a - b };
    }

    function generateDistractors(correctAnswer) {
      const distractors = new Set();
      while (distractors.size < 2) {
        const d = randomInt(1, 9);
        if (d !== correctAnswer) distractors.add(d);
      }
      return [...distractors];
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = randomInt(0, i);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getSelectedMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function renderStarRating(correct, total) {
      const pct = total > 0 ? correct / total : 0;
      let stars = '';
      for (let i = 0; i < 5; i++) {
        stars += `<span class="star ${i < Math.round(pct * 5) ? 'lit' : ''}">⭐</span>`;
      }
      return stars;
    }

    function renderProblems() {
      const mode = getSelectedMode();

      if (problems.length === 0) {
        problemsEl.innerHTML = `<div class="empty-state"><span class="emoji-big">📚</span>Bấm ✨ Tạo đề mới để bắt đầu luyện tập!</div>`;
        return;
      }

      if (mode === 'input') {
        hintText.textContent = '✏️ Nhập đáp án vào ô trống rồi bấm ✅ Chấm điểm nhé!';
        problemsEl.innerHTML = problems.map((problem, index) => `
          <article class="problem" data-index="${index}">
            <div class="expression">
              <span>${problem.first}</span>
              <span>−</span>
              <span>${problem.second}</span>
              <span>=</span>
            </div>
            <input class="answer" type="number" inputmode="numeric" aria-label="Đáp án câu ${index + 1}">
            <span class="result" aria-hidden="true"></span>
          </article>
        `).join('');
      } else {
        hintText.textContent = '🎲 Chọn đáp án đúng cho mỗi câu rồi bấm ✅ Chấm điểm!';
        problemsEl.innerHTML = problems.map((problem, index) => {
          const distractors = generateDistractors(problem.answer);
          const options = shuffle([problem.answer, ...distractors]);
          return `
            <article class="problem" data-index="${index}">
              <div class="expression">
                <span>${problem.first}</span>
                <span>−</span>
                <span>${problem.second}</span>
                <span>=</span>
              </div>
              <div class="mcq-options" role="radiogroup" aria-label="Đáp án câu ${index + 1}">
                ${options.map((val) => `
                  <button class="mcq-btn" type="button" data-value="${val}" role="radio" aria-checked="false">${val}</button>
                `).join('')}
              </div>
              <span class="result" aria-hidden="true"></span>
            </article>
          `;
        }).join('');

        problemsEl.querySelectorAll('.mcq-options').forEach((group) => {
          const btns = group.querySelectorAll('.mcq-btn');
          btns.forEach((btn) => {
            btn.addEventListener('click', () => {
              btns.forEach((b) => { b.classList.remove('selected'); b.setAttribute('aria-checked', 'false'); });
              btn.classList.add('selected');
              btn.setAttribute('aria-checked', 'true');
            });
          });
        });
      }
    }

    function generateProblems() {
      const count = Math.min(60, Math.max(1, Number(countEl.value) || 1));
      countEl.value = count;

      problems = [];
      for (let i = 0; i < count; i++) {
        problems.push(createProblem(problems.length > 0 ? problems[problems.length - 1] : null));
      }

      scoreBox.innerHTML = `🌟 Đã tạo <strong>${count}</strong> câu.`;
      renderProblems();
      app.classList.add('practicing');

      const first = problemsEl.querySelector('.answer, .mcq-btn');
      if (first) first.focus();
    }

    function gradeProblems() {
      const mode = getSelectedMode();

      if (problems.length === 0) {
        scoreBox.textContent = '😅 Hãy bấm ✨ Tạo đề mới trước khi chấm điểm nhé!';
        return;
      }

      let correct = 0;
      const cards = problemsEl.querySelectorAll('.problem');

      cards.forEach((card) => {
        const index = Number(card.dataset.index);
        const result = card.querySelector('.result');
        let isCorrect = false;

        if (mode === 'input') {
          const input = card.querySelector('.answer');
          const value = Number(input.value);
          const hasAnswer = input.value.trim() !== '';
          isCorrect = hasAnswer && value === problems[index].answer;
        } else {
          const selected = card.querySelector('.mcq-btn.selected');
          if (selected) {
            isCorrect = Number(selected.dataset.value) === problems[index].answer;
            selected.classList.toggle('correct', isCorrect);
            selected.classList.toggle('wrong', !isCorrect);
          }
        }

        card.classList.toggle('correct', isCorrect);
        card.classList.toggle('wrong', !isCorrect);
        result.textContent = isCorrect ? '✅' : '❌';

        if (isCorrect) correct += 1;
      });

      const pct = correct / problems.length;
      const msg = pct === 1 ? '🎉🎉🎉 Xuất sắc! Làm bài quá giỏi!' :
                  pct >= 0.8 ? '🎉 Làm tốt lắm! Cố gắng thêm nhé!' :
                  pct >= 0.5 ? '💪 Cố gắng hơn nữa nào!' :
                  '😊 Bé cần luyện thêm. Cố lên!';

      scoreBox.innerHTML = `
        <div>${msg}</div>
        <div style="margin-top:4px;"><strong>${correct}/${problems.length}</strong> câu đúng</div>
        <div class="stars">${renderStarRating(correct, problems.length)}</div>
      `;
    }

    generateBtn.addEventListener('click', generateProblems);
    regenerateBtn.addEventListener('click', generateProblems);
    gradeBtn.addEventListener('click', gradeProblems);
    settingsBtn.addEventListener('click', () => {
      app.classList.remove('practicing');
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
